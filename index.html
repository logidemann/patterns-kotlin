<style>
/* Layout : une colonne de travail. Réglages en haut, sommaire, puis la fiche du pattern en cours. */
:root{
  --bg:#f3f4f8; --surface:#ffffff; --ink:#1b1d2a; --muted:#5d6278; --line:#d9dce8;
  --accent:#6a3df0; --accent-ink:#ffffff; --code-bg:#1e2030; --code-ink:#e4e6f3;
  --crea:#0b8a7a; --struct:#b76a00; --comp:#c2267a;
  --good:#1a8a4a; --bad:#c43c3c;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13141c; --surface:#1c1e2a; --ink:#eceef7; --muted:#a0a5bd; --line:#30344a;
    --accent:#a78bff; --accent-ink:#17102f; --code-bg:#0e0f17; --code-ink:#e4e6f3;
    --crea:#3fd0bd; --struct:#f0a93c; --comp:#ff7ab8; --good:#4fd08a; --bad:#ff8080;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13141c; --surface:#1c1e2a; --ink:#eceef7; --muted:#a0a5bd; --line:#30344a;
  --accent:#a78bff; --accent-ink:#17102f; --code-bg:#0e0f17; --code-ink:#e4e6f3;
  --crea:#3fd0bd; --struct:#f0a93c; --comp:#ff7ab8; --good:#4fd08a; --bad:#ff8080;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
main{max-width:780px;margin:0 auto;padding:20px 16px 64px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:1.7rem}
h2{font-size:1.5rem}
h3{font-size:1.05rem;letter-spacing:.01em}
p{margin:0}
.sub{color:var(--muted);font-size:.95rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px}
.label{font-size:.78rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tog{background:transparent;border:1.5px solid var(--line);border-radius:999px;padding:7px 14px;font-weight:500;font-size:.93rem}
.tog[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip{background:transparent;border:1.5px solid var(--line);border-radius:8px;padding:5px 10px;font-size:.86rem;color:var(--muted)}
.chip[aria-pressed="true"]{color:var(--ink);border-color:var(--fam);box-shadow:inset 3px 0 0 var(--fam)}
.famgroup{display:flex;flex-direction:column;gap:6px}
.famname{font-size:.82rem;font-weight:600;color:var(--fam)}
.f-crea{--fam:var(--crea)} .f-struct{--fam:var(--struct)} .f-comp{--fam:var(--comp)}
details>summary{cursor:pointer;font-weight:500;color:var(--muted);font-size:.93rem}
details[open]>summary{margin-bottom:10px}
.toc{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px}
.toc button{width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:8px;padding:7px 10px;display:flex;align-items:center;gap:8px;font-size:.93rem}

.pill{display:inline-block;font-size:.76rem;font-weight:600;color:var(--fam);border:1.5px solid var(--fam);border-radius:999px;padding:2px 10px}

.sec{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:16px}
.sec p{max-width:65ch}
.kv{display:flex;flex-direction:column;gap:2px}
.kv b{font-size:.85rem;color:var(--muted);font-weight:600}
.tip{border-left:3px solid var(--accent);padding:6px 12px;background:color-mix(in srgb,var(--accent) 8%,transparent);border-radius:0 8px 8px 0;font-size:.95rem}
pre{margin:0;background:var(--code-bg);color:var(--code-ink);border-radius:10px;padding:14px;overflow-x:auto;font-family:var(--mono);font-size:.82rem;line-height:1.55;tab-size:4}
.kw{color:#c3a6ff}.str{color:#a5e3a0}.com{color:#8088a8;font-style:italic}.num{color:#ffb86c}
.q{display:flex;flex-direction:column;gap:8px}

.q .opt.ko{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}

.fb{font-size:.92rem;color:var(--muted)}
textarea{width:100%;min-height:220px;resize:vertical;background:var(--code-bg);color:var(--code-ink);border:1px solid var(--line);border-radius:10px;padding:12px;font-family:var(--mono);font-size:.82rem;line-height:1.5;tab-size:4}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:9px 16px;font-weight:600}

.btn:disabled{opacity:.4;cursor:default}
a{color:var(--accent)}
.nav{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:16px}
.empty{color:var(--muted)}
.note{font-size:.88rem;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.tog,.chip,.opt{transition:background .15s,border-color .15s}}
</style>

<main>

<script>
const FAMS = {crea:"Création", struct:"Structure", comp:"Comportement"};
const P = [
/* ---------- CRÉATION ---------- */
{id:"factory-method", n:"Fabrique", en:"Factory Method", f:"crea",
 i:"Déclare une méthode de création dans une classe mère et laisse les sous-classes décider quel objet concret fabriquer.",
 p:"Ton code de logistique crée des Camion partout. Le jour où il faut gérer des Bateau, tu dois retoucher chaque endroit qui appelle Camion().",
 s:"Les appels directs au constructeur sont remplacés par une méthode fabrique. Le reste du code ne connaît que l'interface Transport.",
 k:"Pour une fabrique simple, Kotlin se contente souvent d'une fonction dans un companion object ou d'une fonction de haut niveau.",
 c:`interface Transport { fun livrer(): String }
class Camion : Transport { override fun livrer() = "Livraison par la route" }
class Bateau : Transport { override fun livrer() = "Livraison par la mer" }

abstract class Logistique {
    abstract fun creerTransport(): Transport   // la méthode fabrique
    fun planifier() = "Plan : " + creerTransport().livrer()
}
class LogistiqueRoutiere : Logistique() { override fun creerTransport() = Camion() }
class LogistiqueMaritime : Logistique() { override fun creerTransport() = Bateau() }

fun main() {
    val logistique: Logistique = LogistiqueMaritime()
    println(logistique.planifier())
}`,
 q:[{q:"Qui décide de la classe concrète à instancier ?",o:["Le code client, avec un when","La sous-classe du créateur","L'interface du produit"],a:1,e:"Chaque sous-classe du créateur redéfinit la méthode fabrique et renvoie son propre produit."},
    {q:"Quel est le gain principal ?",o:["On ajoute un nouveau produit sans modifier le code qui l'utilise","Les objets sont créés plus vite","Il n'existe qu'une seule instance du produit"],a:0,e:"Le code client dépend d'une interface, donc un nouveau produit n'oblige pas à le réécrire."}],
 x:{t:"Crée une interface Bouton avec afficher(): String, deux boutons (BoutonWindows, BoutonWeb) et une classe abstraite Dialogue qui possède la méthode fabrique creerBouton() et une méthode rendre() qui utilise le bouton.",
    d:`interface Bouton { fun afficher(): String }

    // TODO : méthode fabrique creerBouton()

{id:"abstract-factory", n:"Fabrique abstraite", en:"Abstract Factory", f:"crea",
 i:"Crée des familles d'objets assortis sans préciser leurs classes concrètes.",
 p:"Ton interface a un thème clair et un thème sombre. Si chaque écran choisit ses composants à la main, tu finis avec un bouton clair à côté d'une case sombre.",
 s:"Une fabrique par famille. Chaque fabrique sait créer tous les produits de sa famille, donc ils vont forcément ensemble.",
 k:"Les fabriques concrètes n'ont pas d'état : un object Kotlin suffit pour chacune.",
 c:`interface Bouton { fun rendu(): String }
interface Case { fun rendu(): String }

class BoutonClair : Bouton { override fun rendu() = "Bouton clair" }
class CaseClaire : Case { override fun rendu() = "Case claire" }
class BoutonSombre : Bouton { override fun rendu() = "Bouton sombre" }
class CaseSombre : Case { override fun rendu() = "Case sombre" }

interface FabriqueUI {
    fun bouton(): Bouton
    fun case(): Case
}
object ThemeClair : FabriqueUI {
    override fun bouton() = BoutonClair()
    override fun case() = CaseClaire()
}
object ThemeSombre : FabriqueUI {
    override fun bouton() = BoutonSombre()
    override fun case() = CaseSombre()
}

fun ecran(f: FabriqueUI) = f.bouton().rendu() + " + " + f.case().rendu()

fun main() = println(ecran(ThemeSombre))`,
 q:[{q:"Quelle différence avec la Fabrique simple ?",o:["Elle crée plusieurs produits liés, pas un seul","Elle interdit l'héritage","Elle ne crée qu'une seule instance"],a:0,e:"La fabrique abstraite regroupe plusieurs méthodes de création pour une famille de produits cohérents."},
    {q:"Que faut-il faire pour ajouter un thème « contraste élevé » ?",o:["Modifier la fonction ecran()","Ajouter une nouvelle fabrique et ses produits","Ajouter un when dans chaque produit"],a:1,e:"On ajoute une fabrique et ses produits. Le code client ne change pas."}],
 x:{t:"Un magasin vend des meubles Modernes et Victoriens. Crée les interfaces Chaise et Table (méthode style(): String), les quatre classes concrètes, puis une FabriqueMeubles avec deux implémentations. Écris une fonction salon(f) qui décrit une chaise et une table assorties.",

{id:"builder", n:"Monteur", en:"Builder", f:"crea",
 i:"Construit un objet complexe étape par étape, au lieu d'un constructeur avec dix paramètres.",
 p:"Une Pizza a une pâte, des garnitures, du fromage ou non, une cuisson. Un seul constructeur devient illisible : Pizza(\"fine\", true, false, null, 3).",
 s:"Un objet Builder accumule les choix avec des méthodes nommées, puis build() fabrique l'objet final, souvent immuable.",
 k:"Les arguments nommés et les valeurs par défaut de Kotlin remplacent le Builder dans beaucoup de cas. Il reste utile quand la construction se fait en plusieurs étapes ou avec des validations.",
 c:`class Pizza private constructor(
    val pate: String, val garnitures: List<String>, val fromage: Boolean
) {
    class Builder {
        private var pate = "classique"
        private val garnitures = mutableListOf<String>()
        private var fromage = true

        fun pate(p: String) = apply { pate = p }
        fun ajouter(g: String) = apply { garnitures += g }
        fun sansFromage() = apply { fromage = false }
        fun build() = Pizza(pate, garnitures.toList(), fromage)
    }
}

fun main() {
    val pizza = Pizza.Builder().pate("fine").ajouter("champignons").ajouter("olives").build()
    println(pizza.pate + " : " + pizza.garnitures)
}`,
 q:[{q:"À quoi sert apply { } dans les méthodes du Builder ?",o:["À renvoyer le Builder lui-même pour enchaîner les appels","À créer une copie de la pizza","À rendre la méthode privée"],a:0,e:"apply exécute le bloc puis renvoie l'objet, ce qui permet d'écrire .pate(...).ajouter(...).build()."},
    {q:"Dans quel cas un Builder est-il inutile en Kotlin ?",o:["Quand l'objet a beaucoup d'options","Quand des paramètres nommés avec valeurs par défaut suffisent","Quand l'objet est immuable"],a:1,e:"Pizza(pate = \"fine\", fromage = false) est déjà lisible. Le Builder sert quand la construction est plus riche."}],
 x:{t:"Écris un Builder pour une Requete HTTP : url (obligatoire, passée au Builder), methode (\"GET\" par défaut), en-têtes (une map) et corps (optionnel). build() doit refuser un corps sur une requête GET avec require().",
    d:`class Requete(
    val url: String, val methode: String,
    val entetes: Map<String, String>, val corps: String?
)

class RequeteBuilder(private val url: String) {
    // TODO : champs avec valeurs par défaut
    // TODO : methode(), entete(), corps()
    // TODO : build() avec la vérification
}

fun main() {
    // val r = RequeteBuilder("https://exemple.fr").methode("POST").corps("{}").build()
    // println(r.methode + " " + r.url)
}`,
    s:`class Requete(
    val url: String, val methode: String,
    val entetes: Map<String, String>, val corps: String?
)

class RequeteBuilder(private val url: String) {
    private var methode = "GET"
    private val entetes = mutableMapOf<String, String>()
    private var corps: String? = null

    fun methode(m: String) = apply { methode = m }
    fun entete(cle: String, valeur: String) = apply { entetes[cle] = valeur }
    fun corps(c: String) = apply { corps = c }

    fun build(): Requete {
        require(!(methode == "GET" && corps != null)) { "Une requête GET n'a pas de corps" }
        return Requete(url, methode, entetes.toMap(), corps)
    }
}

fun main() {
    val r = RequeteBuilder("https://exemple.fr").methode("POST").corps("{}").build()
    println(r.methode + " " + r.url)
}`}},

{id:"prototype", n:"Prototype", en:"Prototype", f:"crea",
 i:"Crée de nouveaux objets en copiant un objet existant, sans dépendre de sa classe.",
 p:"Tu veux dupliquer un monstre déjà configuré. Recopier ses champs un par un depuis l'extérieur est fragile, et certains champs sont privés.",
 s:"L'objet sait se cloner lui-même. Le code client appelle simplement cloner().",
 k:"Les data class offrent copy() gratuitement. Attention : c'est une copie superficielle, les objets internes sont partagés.",
 c:`data class Stats(var pv: Int, var attaque: Int)

data class Monstre(val nom: String, val stats: Stats) {
    // copie profonde : les stats sont copiées aussi
    fun cloner() = copy(stats = stats.copy())
}

fun main() {
    val modele = Monstre("Gobelin", Stats(pv = 30, attaque = 5))
    val clone = modele.cloner()
    clone.stats.pv = 0
    println(modele.stats.pv)   // 30 : le modèle n'est pas touché
}`,
 q:[{q:"Que fait copy() sur une data class qui contient une liste mutable ?",o:["Elle copie aussi la liste","Elle partage la même liste entre l'original et la copie","Elle vide la liste"],a:1,e:"copy() est superficielle : les références internes sont partagées, sauf si tu les copies toi-même."},
    {q:"Quand le Prototype est-il intéressant ?",o:["Quand créer l'objet de zéro est coûteux ou compliqué","Quand il ne faut qu'une seule instance","Quand on veut cacher un sous-système"],a:0,e:"Copier un objet déjà configuré évite de refaire toute la configuration."}],
 x:{t:"Crée une interface Forme avec cloner(): Forme et description(): String. Implémente Cercle(rayon) et Rectangle(largeur, hauteur). Écris ensuite une fonction dupliquer(formes) qui renvoie une liste de clones sans connaître les classes concrètes.",
    d:`interface Forme {
    fun cloner(): Forme
    fun description(): String
}

// TODO : Cercle et Rectangle

// TODO : fun dupliquer(formes: List<Forme>): List<Forme>

fun main() {
    // val copies = dupliquer(listOf(Cercle(2.0), Rectangle(3.0, 4.0)))
    // copies.forEach { println(it.description()) }
}`,
    s:`interface Forme {
    fun cloner(): Forme
    fun description(): String
}

data class Cercle(val rayon: Double) : Forme {
    override fun cloner() = copy()
    override fun description() = "Cercle de rayon " + rayon
}
data class Rectangle(val largeur: Double, val hauteur: Double) : Forme {
    override fun cloner() = copy()
    override fun description() = "Rectangle " + largeur + " x " + hauteur
}

fun dupliquer(formes: List<Forme>) = formes.map { it.cloner() }

fun main() {
    val copies = dupliquer(listOf(Cercle(2.0), Rectangle(3.0, 4.0)))
    copies.forEach { println(it.description()) }
}`}},

{id:"singleton", n:"Singleton", en:"Singleton", f:"crea",
 i:"Garantit qu'une classe n'a qu'une seule instance et fournit un accès global à celle-ci.",
 p:"Toute l'application doit lire la même configuration. Si chaque écran crée la sienne, les réglages divergent.",
 s:"La classe contrôle sa propre création et expose toujours la même instance.",
 k:"Le mot-clé object crée un singleton, initialisé à la première utilisation et sûr entre threads.",
 c:`object Config {
    private val valeurs = mutableMapOf("langue" to "fr")

    fun lire(cle: String) = valeurs[cle]
    fun ecrire(cle: String, valeur: String) { valeurs[cle] = valeur }
}

fun main() {
    Config.ecrire("theme", "sombre")
    println(Config.lire("theme"))   // même instance partout
}`,
 q:[{q:"Comment déclare-t-on un singleton en Kotlin ?",o:["class Config private constructor()","object Config","static class Config"],a:1,e:"object déclare la classe et son unique instance en une seule fois."},
    {q:"Quel reproche fait-on souvent au Singleton ?",o:["Il consomme trop de mémoire","Il crée un état global qui complique les tests","Il empêche l'héritage d'interfaces"],a:1,e:"Un état global partagé rend le code plus couplé et les tests moins isolés."}],
 x:{t:"Crée un singleton Journal qui garde les messages en mémoire : log(message) ajoute une ligne numérotée, historique() renvoie une copie de la liste, vider() efface tout.",
    d:`// TODO : object Journal

fun main() {
    // Journal.log("Démarrage")
    // Journal.log("Connexion")
    // println(Journal.historique())
}`,
    s:`object Journal {
    private val lignes = mutableListOf<String>()

    fun log(message: String) {
        val numero = lignes.size + 1
        lignes += "#" + numero + " " + message
    }
    fun historique(): List<String> = lignes.toList()
    fun vider() = lignes.clear()
}

fun main() {
    Journal.log("Démarrage")
    Journal.log("Connexion")
    println(Journal.historique())
}`}},

/* ---------- STRUCTURE ---------- */
{id:"adapter", n:"Adaptateur", en:"Adapter", f:"struct",
 i:"Fait collaborer deux classes dont les interfaces sont incompatibles.",
 p:"Ton application attend des températures en Celsius. Le capteur que tu as acheté ne sait répondre qu'en Fahrenheit, et tu ne peux pas modifier son code.",
 s:"Une classe intermédiaire implémente l'interface attendue et traduit chaque appel vers l'objet existant.",
 k:"Pour une traduction légère, une fonction d'extension peut suffire. L'adaptateur reste nécessaire quand il faut respecter une interface.",
 c:`interface Thermometre { fun celsius(): Double }

// Classe existante, qu'on ne peut pas modifier

{id:"command", n:"Commande", en:"Command", f:"comp",
 i:"Transforme une action en objet, pour pouvoir la stocker, la mettre en file ou l'annuler.",
 p:"Ton éditeur a besoin d'un Ctrl+Z. Si les boutons modifient le texte directement, rien ne garde la trace de ce qui a été fait.",
 s:"Chaque action devient un objet avec executer() et annuler(). Un historique empile les commandes exécutées.",
 k:"Sans annulation, une lambda () -> Unit fait une commande parfaite. La classe devient utile dès qu'il faut un annuler().",
 c:`interface Commande {
    fun executer()
    fun annuler()
}
class Editeur { var texte = "" }

class Ajouter(private val editeur: Editeur, private val ajout: String) : Commande {
    override fun executer() { editeur.texte += ajout }
    override fun annuler() { editeur.texte = editeur.texte.removeSuffix(ajout) }
}

class Historique {
    private val pile = ArrayDeque<Commande>()
    fun lancer(c: Commande) { c.executer(); pile.addLast(c) }
    fun annuler() { pile.removeLastOrNull()?.annuler() }
}

fun main() {
    val editeur = Editeur()
    val historique = Historique()
    historique.lancer(Ajouter(editeur, "Bonjour"))
    historique.lancer(Ajouter(editeur, " le monde"))
    historique.annuler()
    println(editeur.texte)   // Bonjour

    s:`class Lampe { var allumee = false }

interface Commande {
    fun executer()
    fun annuler()
}

class Allumer(private val lampe: Lampe) : Commande {
    private var avant = false
    override fun executer() { avant = lampe.allumee; lampe.allumee = true }
    override fun annuler() { lampe.allumee = avant }
}
class Eteindre(private val lampe: Lampe) : Commande {
    private var avant = false
    override fun executer() { avant = lampe.allumee; lampe.allumee = false }
    override fun annuler() { lampe.allumee = avant }
}

class Telecommande {
    private val pile = ArrayDeque<Commande>()
    fun appuyer(c: Commande) { c.executer(); pile.addLast(c) }
    fun annuler() { pile.removeLastOrNull()?.annuler() }
}

    val lampe = Lampe(); val t = Telecommande()
    t.appuyer(Allumer(lampe)); println(lampe.allumee)   // true

    override fun <R> accepter(v: Visiteur<R>) = v.carre(this)
}

class Aire : Visiteur<Double> {
    override fun cercle(c: Cercle) = Math.PI * c.rayon * c.rayon
    override fun carre(c: Carre) = c.cote * c.cote
}
class Nom : Visiteur<String> {
    override fun cercle(c: Cercle) = "cercle"
    override fun carre(c: Carre) = "carré"
}

fun main() {
    val formes = listOf(Cercle(1.0), Carre(2.0))
    formes.forEach { println(it.accepter(Nom()) + " : " + it.accepter(Aire())) }
}`,
 q:[{q:"Que faut-il écrire pour ajouter une nouvelle opération ?",o:["Une méthode dans chaque classe visitée","Une nouvelle classe visiteur","Une nouvelle interface Forme"],a:1,e:"C'est tout l'intérêt : les classes visitées ne bougent pas."},

 x:{t:"Des expressions arithmétiques : Nombre(valeur) et Addition(gauche, droite). Écris l'interface VisiteurExpr, un visiteur Calcul qui renvoie le résultat et un visiteur Affichage qui renvoie le texte, par exemple « (1 + 2) ».",

/* ---------- état ---------- */
const KEY = "atelier-dp-kotlin-v1";
const PARTS = {cours:"Cours", qcm:"QCM", exo:"Exercice"};
let S = {pats:P.map(p=>p.id), parts:["cours","qcm","exo"], cur:P[0].id, prog:{}};
try{
  const raw = JSON.parse(localStorage.getItem(KEY) || "null");
  if(raw && Array.isArray(raw.pats)){
    S.pats = raw.pats.filter(id=>P.some(p=>p.id===id));
    S.parts = (raw.parts||[]).filter(k=>PARTS[k]); if(!S.parts.length) S.parts=["cours"];
    S.cur = raw.cur; S.prog = raw.prog || {};
  }
}catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
const byId = id => P.find(p=>p.id===id);
const selected = () => P.filter(p=>S.pats.includes(p.id));
const prog = id => (S.prog[id] = S.prog[id] || {q:{}, x:null, d:null});

/* ---------- petits outils ---------- */
function el(tag, attrs, ...kids){
  const n = document.createElement(tag);
  for(const k in (attrs||{})){
    const v = attrs[k];
    if(k==="class") n.className = v;
    else if(k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if(v!==false && v!=null) n.setAttribute(k, v);
  }
  for(const kid of kids){ if(kid==null) continue; n.append(kid.nodeType ? kid : document.createTextNode(kid)); }
  return n;
}
const KW = "abstract|apply|by|class|companion|data|else|false|for|fun|get|if|in|init|interface|internal|null|object|open|operator|override|private|protected|return|sealed|set|super|this|true|val|var|when|while";
const RE = new RegExp('(//.*$)|("(?:[^"\\\\]|\\\\.)*")|(\'(?:[^\'\\\\]|\\\\.)\')|\\b(' + KW + ')\\b|\\b(\\d+(?:\\.\\d+)?)\\b', "gm");
function codeBlock(src){
  const pre = el("pre");
  let last = 0, m;
  RE.lastIndex = 0;
  while((m = RE.exec(src))){
    if(m.index > last) pre.append(src.slice(last, m.index));
    const cls = m[1] ? "com" : (m[2]||m[3]) ? "str" : m[4] ? "kw" : "num";
    pre.append(el("span", {class:cls}, m[0]));
    last = m.index + m[0].length;
  }
  pre.append(src.slice(last));
  return pre;
}

/* ---------- réglages ---------- */
function renderConfig(){
  const fams = document.getElementById("fams"); fams.textContent = "";
  const all = S.pats.length === P.length;
  fams.append(el("button", {class:"tog", "aria-pressed":String(all), onclick:()=>{
    S.pats = all ? [] : P.map(p=>p.id); update();
  }}, "Tous"));
  for(const f in FAMS){
    const ids = P.filter(p=>p.f===f).map(p=>p.id);
    const on = ids.every(id=>S.pats.includes(id));
    fams.append(el("button", {class:"tog", "aria-pressed":String(on && !all), onclick:()=>{
      if(all) S.pats = ids;                                   // depuis « Tous » : ne garder que cette famille
      else if(on) S.pats = S.pats.filter(id=>!ids.includes(id));
      else S.pats = P.map(p=>p.id).filter(id=>S.pats.includes(id) || ids.includes(id));
      update();
    }}, FAMS[f] + " (" + ids.length + ")"));
  }

  const chips = document.getElementById("chips"); chips.textContent = "";
  for(const f in FAMS){
    const g = el("div", {class:"famgroup f-"+f}, el("div", {class:"famname"}, FAMS[f]));
    const row = el("div", {class:"row"});
    P.filter(p=>p.f===f).forEach(p=>{
      const on = S.pats.includes(p.id);
      row.append(el("button", {class:"chip", "aria-pressed":String(on), onclick:()=>{
        S.pats = on ? S.pats.filter(id=>id!==p.id) : P.map(x=>x.id).filter(id=>S.pats.includes(id)||id===p.id);
        update();
      }}, p.n));
    });
    g.append(row); chips.append(g);
  }
  document.getElementById("pickerSum").textContent = "Choisir pattern par pattern (" + S.pats.length + " sur " + P.length + ")";

  const parts = document.getElementById("parts"); parts.textContent = "";
  for(const k in PARTS){
    const on = S.parts.includes(k);
    parts.append(el("button", {class:"tog", "aria-pressed":String(on), onclick:()=>{
      if(on && S.parts.length===1) return;                     // garder au moins une partie
      S.parts = on ? S.parts.filter(x=>x!==k) : Object.keys(PARTS).filter(x=>S.parts.includes(x)||x===k);
      update();
    }}, PARTS[k]));
  }
}

/* ---------- sommaire ---------- */
function status(p){
  const pr = prog(p.id), bits = [];
  if(S.parts.includes("qcm")){
    const done = Object.keys(pr.q).length;
    if(done){ const ok = p.q.filter((q,i)=>pr.q[i]===q.a).length; bits.push("QCM " + ok + "/" + p.q.length); }
  }
  if(S.parts.includes("exo") && pr.x) bits.push(pr.x==="ok" ? "exo réussi" : "exo à revoir");
  return bits.join(" · ");
}
function renderToc(){
  const list = selected(), toc = document.getElementById("toc"); toc.textContent = "";
  document.getElementById("tocCount").textContent = list.length + (list.length>1 ? " patterns" : " pattern");
  list.forEach(p=>{
    toc.append(el("li", {class:"f-"+p.f},
      el("button", {"aria-current":String(p.id===S.cur), onclick:()=>go(p.id, true)},
        el("span", {class:"dot"}), el("span", null, p.n), el("span", {class:"st"}, status(p)))));
  });
}

/* ---------- fiche ---------- */
function renderLesson(){
  const box = document.getElementById("lesson"); box.textContent = "";
  const list = selected();
  if(!list.length){
    box.append(el("p", {class:"empty"}, "Aucun pattern sélectionné. Choisis une famille ou un pattern dans les réglages."));
    return;
  }
  const p = byId(S.cur), pr = prog(p.id), idx = list.indexOf(p);
  box.className = "panel lesson f-" + p.f;
  box.append(el("header", null,
    el("div", {class:"row", style:"align-items:center"},
      el("span", {class:"pill"}, FAMS[p.f]),
      el("span", {class:"sub"}, (idx+1) + " / " + list.length + " · " + p.en)),
    el("h2", null, p.n),
    el("p", null, p.i)));

  if(S.parts.includes("cours")){
    box.append(el("section", {class:"sec"},
      el("h3", null, "Cours"),
      el("div", {class:"kv"}, el("b", null, "Le problème"), el("p", null, p.p)),
      el("div", {class:"kv"}, el("b", null, "L'idée"), el("p", null, p.s)),
      el("p", {class:"tip"}, "En Kotlin : " + p.k),
      codeBlock(p.c)));
  }

  if(S.parts.includes("qcm")){
    const sec = el("section", {class:"sec"}, el("h3", null, "QCM"));
    p.q.forEach((q, qi)=>{
      const ans = pr.q[qi], done = ans !== undefined;
      const wrap = el("div", {class:"q"}, el("p", null, (qi+1) + ". " + q.q));
      q.o.forEach((o, oi)=>{
        let cls = "opt";
        if(done && oi===q.a) cls += " ok"; else if(done && oi===ans) cls += " ko";
        wrap.append(el("button", {class:cls, disabled:done, onclick:()=>{ pr.q[qi]=oi; save(); renderToc(); renderLesson(); }}, o));
      });
      if(done) wrap.append(el("p", {class:"fb"}, (ans===q.a ? "Bonne réponse. " : "Raté. ") + q.e));
      sec.append(wrap);
    });
    if(Object.keys(pr.q).length) sec.append(el("div", null,
      el("button", {class:"btn ghost", onclick:()=>{ pr.q={}; save(); renderToc(); renderLesson(); }}, "Refaire le QCM")));
    box.append(sec);
  }

  if(S.parts.includes("exo")){
    const ta = el("textarea", {id:"code-"+p.id, spellcheck:"false", autocapitalize:"off", autocomplete:"off", "aria-label":"Ton code Kotlin"});
    ta.value = pr.d != null ? pr.d : p.x.d;
    ta.addEventListener("input", ()=>{ pr.d = ta.value; save(); });
    const copyBtn = el("button", {class:"btn ghost", onclick:async()=>{
      try{ await navigator.clipboard.writeText(ta.value); copyBtn.textContent = "Copié"; }
      catch(e){ ta.select(); copyBtn.textContent = "Sélectionné, copie à la main"; }
      setTimeout(()=>copyBtn.textContent="Copier mon code", 1800);
    }}, "Copier mon code");
    const sol = el("div", {style:"display:none;flex-direction:column;gap:10px"},
      codeBlock(p.x.s),
      el("p", {class:"note"}, "Compare avec ton code. Plusieurs solutions sont valables."),
      el("div", {class:"row"},
        el("button", {class:"btn", onclick:()=>{ pr.x="ok"; save(); renderToc(); mark(); }}, "J'ai réussi"),
        el("button", {class:"btn ghost", onclick:()=>{ pr.x="ko"; save(); renderToc(); mark(); }}, "À revoir")));
    const verdict = el("p", {class:"fb"});
    const mark = ()=>{ verdict.textContent = pr.x==="ok" ? "Marqué comme réussi." : pr.x==="ko" ? "Marqué à revoir." : ""; };
    mark();
    const showBtn = el("button", {class:"btn ghost", onclick:()=>{
      const open = sol.style.display === "none";
      sol.style.display = open ? "flex" : "none";
      showBtn.textContent = open ? "Masquer la solution" : "Voir la solution";
    }}, "Voir la solution");
    box.append(el("section", {class:"sec"},
      el("h3", null, "Exercice"),
      el("p", null, p.x.t),
      ta,
      el("div", {class:"row"},
        copyBtn,
        el("button", {class:"btn ghost", onclick:()=>{ pr.d=null; ta.value=p.x.d; save(); }}, "Réinitialiser"),
        showBtn),
      el("p", {class:"note"}, "Pour exécuter ton code : copie-le, puis colle-le sur ",
        el("a", {href:"https://play.kotlinlang.org/", target:"_blank", rel:"noopener"}, "play.kotlinlang.org"), "."),
      sol, verdict));
  }

  box.append(el("nav", {class:"nav"},
    el("button", {class:"btn ghost", disabled:idx===0, onclick:()=>go(list[idx-1].id, true)}, "← Précédent"),
    el("button", {class:"btn", disabled:idx===list.length-1, onclick:()=>go(list[idx+1].id, true)}, "Suivant →")));
}

/* ---------- navigation ---------- */
function go(id, scroll){
  S.cur = id; save();
  try{ if(location.hash !== "#"+id) history.replaceState(null, "", "#"+id); }catch(e){}
  renderToc(); renderLesson();
  if(scroll) document.getElementById("lesson").scrollIntoView({block:"start",
    behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
}
function update(){
  const list = selected();
  if(list.length && !list.some(p=>p.id===S.cur)) S.cur = list[0].id;
  save(); renderConfig(); renderToc(); renderLesson();
}
function fromHash(){
  const id = location.hash.slice(1);
  if(byId(id)){
    if(!S.pats.includes(id)) S.pats = P.map(p=>p.id).filter(x=>S.pats.includes(x)||x===id);
    S.cur = id;
  }
}
addEventListener("hashchange", ()=>{ fromHash(); update(); });
if(!byId(S.cur)) S.cur = P[0].id;
fromHash(); update();
</script>
