<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atelier Design Patterns Kotlin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout : une colonne de travail. Réglages en haut, sommaire, puis la fiche du pattern en cours. */
:root{
  --bg:#f3f4f8; --surface:#ffffff; --ink:#1b1d2a; --muted:#5d6278; --line:#d9dce8;
  --accent:#6a3df0; --accent-ink:#ffffff; --code-bg:#1e2030; --code-ink:#e4e6f3;
  --crea:#0b8a7a; --struct:#b76a00; --comp:#c2267a;
  --good:#1a8a4a; --bad:#c43c3c;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13141c; --surface:#1c1e2a; --ink:#eceef7; --muted:#a0a5bd; --line:#30344a;
    --accent:#a78bff; --accent-ink:#17102f; --code-bg:#0e0f17; --code-ink:#e4e6f3;
    --crea:#3fd0bd; --struct:#f0a93c; --comp:#ff7ab8; --good:#4fd08a; --bad:#ff8080;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13141c; --surface:#1c1e2a; --ink:#eceef7; --muted:#a0a5bd; --line:#30344a;
  --accent:#a78bff; --accent-ink:#17102f; --code-bg:#0e0f17; --code-ink:#e4e6f3;
  --crea:#3fd0bd; --struct:#f0a93c; --comp:#ff7ab8; --good:#4fd08a; --bad:#ff8080;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
main{max-width:780px;margin:0 auto;padding:20px 16px 64px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:1.7rem}
h2{font-size:1.5rem}
h3{font-size:1.05rem;letter-spacing:.01em}
p{margin:0}
.sub{color:var(--muted);font-size:.95rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px}
.label{font-size:.78rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tog{background:transparent;border:1.5px solid var(--line);border-radius:999px;padding:7px 14px;font-weight:500;font-size:.93rem}
.tog[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip{background:transparent;border:1.5px solid var(--line);border-radius:8px;padding:5px 10px;font-size:.86rem;color:var(--muted)}
.chip[aria-pressed="true"]{color:var(--ink);border-color:var(--fam);box-shadow:inset 3px 0 0 var(--fam)}
.famgroup{display:flex;flex-direction:column;gap:6px}
.famname{font-size:.82rem;font-weight:600;color:var(--fam)}
.f-crea{--fam:var(--crea)} .f-struct{--fam:var(--struct)} .f-comp{--fam:var(--comp)}
details>summary{cursor:pointer;font-weight:500;color:var(--muted);font-size:.93rem}
details[open]>summary{margin-bottom:10px}
.toc{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px}
.toc button{width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:8px;padding:7px 10px;display:flex;align-items:center;gap:8px;font-size:.93rem}
.toc button[aria-current="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent);font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;background:var(--fam);flex:none}
.toc .st{margin-left:auto;font-size:.76rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;font-size:.76rem;font-weight:600;color:var(--fam);border:1.5px solid var(--fam);border-radius:999px;padding:2px 10px}
.lesson{gap:20px}
.lesson header{display:flex;flex-direction:column;gap:8px}
.sec{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:16px}
.sec p{max-width:65ch}
.kv{display:flex;flex-direction:column;gap:2px}
.kv b{font-size:.85rem;color:var(--muted);font-weight:600}
.tip{border-left:3px solid var(--accent);padding:6px 12px;background:color-mix(in srgb,var(--accent) 8%,transparent);border-radius:0 8px 8px 0;font-size:.95rem}
pre{margin:0;background:var(--code-bg);color:var(--code-ink);border-radius:10px;padding:14px;overflow-x:auto;font-family:var(--mono);font-size:.82rem;line-height:1.55;tab-size:4}
.kw{color:#c3a6ff}.str{color:#a5e3a0}.com{color:#8088a8;font-style:italic}.num{color:#ffb86c}
.q{display:flex;flex-direction:column;gap:8px}
.q .opt{text-align:left;background:transparent;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px}
.q .opt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,transparent)}
.q .opt.ko{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.q .opt:disabled{cursor:default;opacity:1;color:inherit}
.fb{font-size:.92rem;color:var(--muted)}
textarea{width:100%;min-height:220px;resize:vertical;background:var(--code-bg);color:var(--code-ink);border:1px solid var(--line);border-radius:10px;padding:12px;font-family:var(--mono);font-size:.82rem;line-height:1.5;tab-size:4}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:9px 16px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}
a{color:var(--accent)}
.nav{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:16px}
.empty{color:var(--muted)}
.note{font-size:.88rem;color:var(--muted)}
.ccbtn{width:100%;text-align:left;display:flex;flex-direction:column;gap:2px;background:color-mix(in srgb,var(--accent) 8%,transparent);border:1.5px solid var(--accent);border-radius:12px;padding:12px 14px}
.ccbtn .cct{font-family:var(--display);font-weight:700;font-size:1.1rem;color:var(--accent)}
.ccbtn .ccs{font-size:.88rem;color:var(--muted)}
.ccbtn[aria-pressed="true"]{background:var(--accent)}
.ccbtn[aria-pressed="true"] .cct,.ccbtn[aria-pressed="true"] .ccs{color:var(--accent-ink)}
[hidden]{display:none !important}
.chip.ok{color:var(--ink);border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent);box-shadow:none}
.chip.ko{color:var(--ink);border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent);box-shadow:none}
.chip.miss{color:var(--ink);border-color:var(--good);border-style:dashed;box-shadow:none}
.chip:disabled{cursor:default;opacity:1}
.besoins{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px;max-width:68ch}
.corr{display:flex;flex-direction:column;gap:10px}
.corr .it{border-left:3px solid var(--good);padding:4px 12px;display:flex;flex-direction:column;gap:2px}
.corr .it.rate{border-left-color:var(--bad)}
.corr .it b{font-size:.95rem}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;font-size:.88rem;align-self:flex-start}
.score{font-family:var(--display);font-weight:700;font-size:1.1rem}
.cours{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.cours .label{color:var(--fam)}
/* Éditeur exécutable (Kotlin Playground) */
.kp{display:flex;flex-direction:column;gap:8px;min-width:0}
.kp .executable-fragment-wrapper{margin:0 0 20px;max-width:100%}
.kp .executable-fragment{border-radius:10px;overflow:hidden;border-color:var(--line)}
.kp .CodeMirror{font-family:var(--mono);font-size:.82rem;line-height:1.55}
.kp .CodeMirror pre{background:transparent;border-radius:0;padding:0 4px;overflow:visible;font-family:inherit;font-size:inherit;line-height:inherit !important}
.kp .CodeMirror-lines{padding:10px 0}
.kp .output-wrapper,.kp .js-code-output-executor{font-family:var(--mono);font-size:.82rem}
.kp .output-wrapper pre,.kp .js-code-output-executor pre{background:transparent;padding:0;border-radius:0}
.run{display:inline-flex;align-items:center;gap:8px}
.run::before{content:"";border-style:solid;border-width:6px 0 6px 10px;border-color:transparent transparent transparent currentColor}
@media (prefers-reduced-motion:no-preference){.tog,.chip,.opt{transition:background .15s,border-color .15s}}
</style>
</head>
<body>
<main>
  <div>
    <h1>Atelier Design Patterns Kotlin</h1>
    <p class="sub">Choisis tes patterns et ce que tu veux travailler. La fiche s'adapte tout de suite.</p>
  </div>

  <section class="panel" aria-label="Réglages">

</main>

<script>
const FAMS = {crea:"Création", struct:"Structurel", comp:"Comportemental"};
const P = [
/* ---------- CRÉATION ---------- */
{id:"factory-method", n:"Factory", en:"Factory Method", f:"crea",
 i:"Déclare une méthode de création dans une classe mère et laisse les sous-classes décider quel objet concret fabriquer.",
 p:"Ton code de logistique crée des Camion partout. Le jour où il faut gérer des Bateau, tu dois retoucher chaque endroit qui appelle Camion().",
 s:"Les appels directs au constructeur sont remplacés par une méthode fabrique. Le reste du code ne connaît que l'interface Transport.",
 k:"Pour une fabrique simple, Kotlin se contente souvent d'une fonction dans un companion object ou d'une fonction de haut niveau.",
 c:`interface Transport { fun livrer(): String }
class Camion : Transport { override fun livrer() = "Livraison par la route" }
class Bateau : Transport { override fun livrer() = "Livraison par la mer" }

abstract class Logistique {
    abstract fun creerTransport(): Transport   // la méthode fabrique
    fun planifier() = "Plan : " + creerTransport().livrer()
}
class LogistiqueRoutiere : Logistique() { override fun creerTransport() = Camion() }
class LogistiqueMaritime : Logistique() { override fun creerTransport() = Bateau() }

fun main() {
    val logistique: Logistique = LogistiqueMaritime()
    println(logistique.planifier())
}`,
 q:[{q:"Qui décide de la classe concrète à instancier ?",o:["Le code client, avec un when","La sous-classe du créateur","L'interface du produit"],a:1,e:"Chaque sous-classe du créateur redéfinit la méthode fabrique et renvoie son propre produit."},
    {q:"Quel est le gain principal ?",o:["On ajoute un nouveau produit sans modifier le code qui l'utilise","Les objets sont créés plus vite","Il n'existe qu'une seule instance du produit"],a:0,e:"Le code client dépend d'une interface, donc un nouveau produit n'oblige pas à le réécrire."}],
 x:{t:"Crée une interface Bouton avec afficher(): String, deux boutons (BoutonWindows, BoutonWeb) et une classe abstraite Dialogue qui possède la méthode fabrique creerBouton() et une méthode rendre() qui utilise le bouton.",
    d:`interface Bouton { fun afficher(): String }

    // TODO : méthode fabrique creerBouton()

fun main() {

    s:`interface Bouton { fun afficher(): String }
class BoutonWindows : Bouton { override fun afficher() = "bouton Windows" }
class BoutonWeb : Bouton { override fun afficher() = "bouton HTML" }

{id:"abstract-factory", n:"Abstract Factory", en:"Abstract Factory", f:"crea",
 i:"Crée des familles d'objets assortis sans préciser leurs classes concrètes.",
 p:"Ton interface a un thème clair et un thème sombre. Si chaque écran choisit ses composants à la main, tu finis avec un bouton clair à côté d'une case sombre.",
 s:"Une fabrique par famille. Chaque fabrique sait créer tous les produits de sa famille, donc ils vont forcément ensemble.",
 k:"Les fabriques concrètes n'ont pas d'état : un object Kotlin suffit pour chacune.",
 c:`interface Bouton { fun rendu(): String }
interface Case { fun rendu(): String }

class BoutonClair : Bouton { override fun rendu() = "Bouton clair" }
class CaseClaire : Case { override fun rendu() = "Case claire" }
class BoutonSombre : Bouton { override fun rendu() = "Bouton sombre" }
class CaseSombre : Case { override fun rendu() = "Case sombre" }

interface FabriqueUI {
    fun bouton(): Bouton
    fun case(): Case
}
object ThemeClair : FabriqueUI {
    override fun bouton() = BoutonClair()
    override fun case() = CaseClaire()
}
object ThemeSombre : FabriqueUI {
    override fun bouton() = BoutonSombre()
    override fun case() = CaseSombre()
}

fun ecran(f: FabriqueUI) = f.bouton().rendu() + " + " + f.case().rendu()

fun main() = println(ecran(ThemeSombre))`,
 q:[{q:"Quelle différence avec la Factory ?",o:["Elle crée plusieurs produits liés, pas un seul","Elle interdit l'héritage","Elle ne crée qu'une seule instance"],a:0,e:"La fabrique abstraite regroupe plusieurs méthodes de création pour une famille de produits cohérents."},
    {q:"Que faut-il faire pour ajouter un thème « contraste élevé » ?",o:["Modifier la fonction ecran()","Ajouter une nouvelle fabrique et ses produits","Ajouter un when dans chaque produit"],a:1,e:"On ajoute une fabrique et ses produits. Le code client ne change pas."}],
 x:{t:"Un magasin vend des meubles Modernes et Victoriens. Crée les interfaces Chaise et Table (méthode style(): String), les quatre classes concrètes, puis une FabriqueMeubles avec deux implémentations. Écris une fonction salon(f) qui décrit une chaise et une table assorties.",
    d:`interface Chaise { fun style(): String }
interface Table { fun style(): String }

    s:`interface Chaise { fun style(): String }
interface Table { fun style(): String }

class ChaiseModerne : Chaise { override fun style() = "chaise moderne" }
class TableModerne : Table { override fun style() = "table moderne" }
class ChaiseVictorienne : Chaise { override fun style() = "chaise victorienne" }

interface FabriqueMeubles {
    fun chaise(): Chaise

object Moderne : FabriqueMeubles {

{id:"builder", n:"Builder", en:"Builder", f:"crea",
 i:"Construit un objet complexe étape par étape, au lieu d'un constructeur avec dix paramètres.",
 p:"Une Pizza a une pâte, des garnitures, du fromage ou non, une cuisson. Un seul constructeur devient illisible : Pizza(\"fine\", true, false, null, 3).",
 s:"Un objet Builder accumule les choix avec des méthodes nommées, puis build() fabrique l'objet final, souvent immuable.",
 k:"Les arguments nommés et les valeurs par défaut de Kotlin remplacent le Builder dans beaucoup de cas. Il reste utile quand la construction se fait en plusieurs étapes ou avec des validations.",
 c:`class Pizza private constructor(
    val pate: String, val garnitures: List<String>, val fromage: Boolean
) {
    class Builder {
        private var pate = "classique"
        private val garnitures = mutableListOf<String>()
        private var fromage = true

        fun pate(p: String) = apply { pate = p }
        fun ajouter(g: String) = apply { garnitures += g }
        fun sansFromage() = apply { fromage = false }
        fun build() = Pizza(pate, garnitures.toList(), fromage)
    }
}

fun main() {
    val pizza = Pizza.Builder().pate("fine").ajouter("champignons").ajouter("olives").build()
    println(pizza.pate + " : " + pizza.garnitures)
}`,
 q:[{q:"À quoi sert apply { } dans les méthodes du Builder ?",o:["À renvoyer le Builder lui-même pour enchaîner les appels","À créer une copie de la pizza","À rendre la méthode privée"],a:0,e:"apply exécute le bloc puis renvoie l'objet, ce qui permet d'écrire .pate(...).ajouter(...).build()."},
    {q:"Dans quel cas un Builder est-il inutile en Kotlin ?",o:["Quand l'objet a beaucoup d'options","Quand des paramètres nommés avec valeurs par défaut suffisent","Quand l'objet est immuable"],a:1,e:"Pizza(pate = \"fine\", fromage = false) est déjà lisible. Le Builder sert quand la construction est plus riche."}],
 x:{t:"Écris un Builder pour une Requete HTTP : url (obligatoire, passée au Builder), methode (\"GET\" par défaut), en-têtes (une map) et corps (optionnel). build() doit refuser un corps sur une requête GET avec require().",
    d:`class Requete(
    val url: String, val methode: String,
    val entetes: Map<String, String>, val corps: String?
)

class RequeteBuilder(private val url: String) {
    // TODO : champs avec valeurs par défaut
    // TODO : methode(), entete(), corps()

}

fun main() {
    // val r = RequeteBuilder("https://exemple.fr").methode("POST").corps("{}").build()
    // println(r.methode + " " + r.url)
}`,
    s:`class Requete(
    val url: String, val methode: String,
    val entetes: Map<String, String>, val corps: String?
)

class RequeteBuilder(private val url: String) {
    private var methode = "GET"
    private val entetes = mutableMapOf<String, String>()
    private var corps: String? = null

    fun methode(m: String) = apply { methode = m }
    fun entete(cle: String, valeur: String) = apply { entetes[cle] = valeur }
    fun corps(c: String) = apply { corps = c }

    fun build(): Requete {
        require(!(methode == "GET" && corps != null)) { "Une requête GET n'a pas de corps" }
        return Requete(url, methode, entetes.toMap(), corps)
    }
}

fun main() {
    val r = RequeteBuilder("https://exemple.fr").methode("POST").corps("{}").build()
    println(r.methode + " " + r.url)
}`}},

{id:"prototype", n:"Prototype", en:"Prototype", f:"crea",
 i:"Crée de nouveaux objets en copiant un objet existant, sans dépendre de sa classe.",
 p:"Tu veux dupliquer un monstre déjà configuré. Recopier ses champs un par un depuis l'extérieur est fragile, et certains champs sont privés.",
 s:"L'objet sait se cloner lui-même. Le code client appelle simplement cloner().",
 k:"Les data class offrent copy() gratuitement. Attention : c'est une copie superficielle, les objets internes sont partagés.",
 c:`data class Stats(var pv: Int, var attaque: Int)

data class Monstre(val nom: String, val stats: Stats) {
    // copie profonde : les stats sont copiées aussi
    fun cloner() = copy(stats = stats.copy())
}

fun main() {
    val modele = Monstre("Gobelin", Stats(pv = 30, attaque = 5))
    val clone = modele.cloner()
    clone.stats.pv = 0
    println(modele.stats.pv)   // 30 : le modèle n'est pas touché
}`,
 q:[{q:"Que fait copy() sur une data class qui contient une liste mutable ?",o:["Elle copie aussi la liste","Elle partage la même liste entre l'original et la copie","Elle vide la liste"],a:1,e:"copy() est superficielle : les références internes sont partagées, sauf si tu les copies toi-même."},
    {q:"Quand le Prototype est-il intéressant ?",o:["Quand créer l'objet de zéro est coûteux ou compliqué","Quand il ne faut qu'une seule instance","Quand on veut cacher un sous-système"],a:0,e:"Copier un objet déjà configuré évite de refaire toute la configuration."}],
 x:{t:"Crée une interface Forme avec cloner(): Forme et description(): String. Implémente Cercle(rayon) et Rectangle(largeur, hauteur). Écris ensuite une fonction dupliquer(formes) qui renvoie une liste de clones sans connaître les classes concrètes.",

    s:`interface Forme {
    fun cloner(): Forme
    fun description(): String
}

data class Cercle(val rayon: Double) : Forme {
    override fun cloner() = copy()
    override fun description() = "Cercle de rayon " + rayon
}
data class Rectangle(val largeur: Double, val hauteur: Double) : Forme {
    override fun cloner() = copy()

    override fun annuler() { editeur.texte = editeur.texte.removeSuffix(ajout) }

    private val pile = ArrayDeque<Commande>()
    fun lancer(c: Commande) { c.executer(); pile.addLast(c) }
    fun annuler() { pile.removeLastOrNull()?.annuler() }

    fun cercle(c: Cercle): R
    fun carre(c: Carre): R

interface Forme { fun <R> accepter(v: Visiteur<R>): R }

class Cercle(val rayon: Double) : Forme {
    override fun <R> accepter(v: Visiteur<R>) = v.cercle(this)
}
class Carre(val cote: Double) : Forme {
    override fun <R> accepter(v: Visiteur<R>) = v.carre(this)
}

class Aire : Visiteur<Double> {
    override fun cercle(c: Cercle) = Math.PI * c.rayon * c.rayon
    override fun carre(c: Carre) = c.cote * c.cote
}

    override fun cercle(c: Cercle) = "cercle"
    override fun carre(c: Carre) = "carré"
}

interface Visiteur<R> {
    fun cercle(c: Cercle): R
    fun rectangle(r: Rectangle): R
    fun groupe(g: Groupe): R

// Besoins 1 et 2 : Composite + Prototype
interface Forme {
    fun aire(): Double
    fun cloner(): Forme
    fun <R> accepter(v: Visiteur<R>): R
}
class Cercle(val rayon: Double) : Forme {
    override fun aire() = 3.14 * rayon * rayon
    override fun cloner(): Forme = Cercle(rayon)
    override fun <R> accepter(v: Visiteur<R>) = v.cercle(this)
}
class Rectangle(val largeur: Double, val hauteur: Double) : Forme {
    override fun aire() = largeur * hauteur
    override fun cloner(): Forme = Rectangle(largeur, hauteur)
    override fun <R> accepter(v: Visiteur<R>) = v.rectangle(this)
}
class Groupe : Forme {
    val enfants = mutableListOf<Forme>()
    fun ajouter(f: Forme) = apply { enfants += f }
    fun retirer(f: Forme) { enfants -= f }
    override fun aire() = enfants.sumOf { it.aire() }
    override fun cloner(): Forme {
        val copie = Groupe()
        enfants.forEach { copie.ajouter(it.cloner()) }
        return copie
    }
    override fun <R> accepter(v: Visiteur<R>) = v.groupe(this)
}

class ExportTexte : Visiteur<String> {
    override fun cercle(c: Cercle) = "Cercle(" + c.rayon + ")"
    override fun rectangle(r: Rectangle) = "Rectangle(" + r.largeur + " x " + r.hauteur + ")"
    override fun groupe(g: Groupe): String =
        "Groupe[" + g.enfants.joinToString(", ") { it.accepter(this) } + "]"
}

    fun executer()
    fun annuler()
}
class AjouterForme(private val dessin: Groupe, private val forme: Forme) : Commande {
    override fun executer() { dessin.ajouter(forme) }
    override fun annuler() { dessin.retirer(forme) }
}
class Historique {
    private val pile = ArrayDeque<Commande>()
    fun executer(c: Commande) { c.executer(); pile.addLast(c) }
    fun annuler() { pile.removeLastOrNull()?.annuler() }
}

fun main() {

    val historique = Historique()
    val cercle = Cercle(1.0)
    historique.executer(AjouterForme(dessin, cercle))
    historique.executer(AjouterForme(dessin, Groupe().ajouter(Rectangle(2.0, 3.0)).ajouter(cercle.cloner())))
    println(dessin.accepter(ExportTexte()))

}`},

// Besoin 1 : Itérateur
class Panier : Iterable<Article> {
    private val articles = mutableListOf<Article>()
    fun ajouter(a: Article) { articles += a }
    override fun iterator(): Iterator<Article> = object : Iterator<Article> {
        private var position = 0
        override fun hasNext() = position < articles.size
        override fun next() = articles[position++]
    }
}

// Besoin 2 : Stratégie
fun interface Livraison { fun frais(total: Double): Double }
val standard = Livraison { 4.9 }
val express = Livraison { 9.9 }
val offerteDes50 = Livraison { total -> if (total >= 50) 0.0 else 4.9 }

class Boutique(var livraison: Livraison) {
    fun total(panier: Panier): Double {
        var somme = 0.0
        for (a in panier) somme += a.prix
        return somme + livraison.frais(somme)
    }
}

// Besoin 3 : Adapteur
class AdapteurBanque(private val banque: BanqueLegacy) : Paiement {
    override fun payer(euros: Double): String {
        val code = banque.debiter(Math.round(euros * 100))
        return if (code == 0) "Carte : paiement accepté" else "Carte : paiement refusé"
    }
}
class PaiementPaypal : Paiement {
    override fun payer(euros: Double) = "PayPal : paiement accepté"
}

// Besoin 4 : Factory
abstract class Caisse {
    abstract fun creerPaiement(): Paiement          // la méthode de création
    fun regler(total: Double) = creerPaiement().payer(total)
}
class CaisseCarte : Caisse() { override fun creerPaiement(): Paiement = AdapteurBanque(BanqueLegacy()) }
class CaissePaypal : Caisse() { override fun creerPaiement(): Paiement = PaiementPaypal() }

        return "audio:" + titre
    }
}

// Besoin 1 : Itérateur
class Playlist : Iterable<Morceau> {
    private val morceaux = mutableListOf<Morceau>()
    fun ajouter(m: Morceau) = apply { morceaux += m }
    override fun iterator(): Iterator<Morceau> = object : Iterator<Morceau> {
        private var position = 0
        override fun hasNext() = position < morceaux.size
        override fun next() = morceaux[position++]
    }
}

// Besoin 2 : Proxy
class CatalogueCache(private val distant: Catalogue) : Catalogue {
    private val cache = mutableMapOf<String, String>()
    override fun telecharger(titre: String) = cache.getOrPut(titre) { distant.telecharger(titre) }
}

// Besoin 3 : Stratégie
fun interface OrdreLecture { fun ordonner(titres: List<String>): List<String> }
val dansLOrdre = OrdreLecture { it }
val alphabetique = OrdreLecture { it.sorted() }
val inverse = OrdreLecture { it.reversed() }

// Besoin 4 : État
interface EtatLecteur { fun appuyerLecture(lecteur: Lecteur): String }
object EnPause : EtatLecteur {
    override fun appuyerLecture(lecteur: Lecteur): String { lecteur.etat = EnLecture; return "Lecture" }
}
object EnLecture : EtatLecteur {
    override fun appuyerLecture(lecteur: Lecteur): String { lecteur.etat = EnPause; return "Pause" }
}
object Verrouille : EtatLecteur {
    override fun appuyerLecture(lecteur: Lecteur) = "Écran verrouillé : rien ne se passe"
}

class Lecteur(private val catalogue: Catalogue, var ordre: OrdreLecture) {
    var etat: EtatLecteur = EnPause
    fun appuyerLecture() = etat.appuyerLecture(this)
    fun file(playlist: Playlist): List<String> {
        val titres = mutableListOf<String>()
        for (m in playlist) titres += m.titre
        return ordre.ordonner(titres)
    }
    fun jouer(titre: String) = catalogue.telecharger(titre)
}

fun main() {
    val playlist = Playlist().ajouter(Morceau("Zénith")).ajouter(Morceau("Aube")).ajouter(Morceau("Minuit"))

    println(lecteur.jouer("Aube"))

    println(lecteur.appuyerLecture())
    println(lecteur.appuyerLecture())
    lecteur.etat = Verrouille
    println(lecteur.appuyerLecture())
}`},

const KEY = "atelier-dp-kotlin-v1";
const PARTS = {cours:"Cours", qcm:"QCM", exo:"Exercice"};

         mode:null,                                  // "cc" pendant l'entraînement au contrôle
         cc:{id:SUJETS[0].id, sel:[], ok:false, d:{}, x:{}}};   // sujet en cours, patterns cochés, sélection validée, brouillons, verdicts
try{
  const raw = JSON.parse(localStorage.getItem(KEY) || "null");
  if(raw && Array.isArray(raw.pats)){
    S.pats = raw.pats.filter(id=>P.some(p=>p.id===id));
    S.parts = (raw.parts||[]).filter(k=>PARTS[k]); if(!S.parts.length) S.parts=["cours"];
    S.cur = raw.cur; S.prog = raw.prog || {};
    S.mode = raw.mode === "cc" ? "cc" : null;
    if(raw.cc && SUJETS.some(x=>x.id===raw.cc.id))
      S.cc = {id:raw.cc.id, sel:(raw.cc.sel||[]).filter(id=>CC.includes(id)), ok:!!raw.cc.ok, d:raw.cc.d||{}, x:raw.cc.x||{}};
  }
}catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
const byId = id => P.find(p=>p.id===id);
const selected = () => P.filter(p=>S.pats.includes(p.id));
const prog = id => (S.prog[id] = S.prog[id] || {q:{}, x:null, d:null});

/* ---------- petits outils ---------- */
function el(tag, attrs, ...kids){
  const n = document.createElement(tag);
  for(const k in (attrs||{})){
    const v = attrs[k];
    if(k==="class") n.className = v;
    else if(k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if(v!==false && v!=null) n.setAttribute(k, v);
  }
  for(const kid of kids){ if(kid==null) continue; n.append(kid.nodeType ? kid : document.createTextNode(kid)); }
  return n;
}
const KW = "abstract|apply|by|class|companion|data|else|false|for|fun|get|if|in|init|interface|internal|null|object|open|operator|override|private|protected|return|sealed|set|super|this|true|val|var|when|while";
const RE = new RegExp('(//.*$)|("(?:[^"\\\\]|\\\\.)*")|(\'(?:[^\'\\\\]|\\\\.)\')|\\b(' + KW + ')\\b|\\b(\\d+(?:\\.\\d+)?)\\b', "gm");
function codeBlock(src){
  const pre = el("pre");
  let last = 0, m;
  RE.lastIndex = 0;
  while((m = RE.exec(src))){
    if(m.index > last) pre.append(src.slice(last, m.index));
    const cls = m[1] ? "com" : (m[2]||m[3]) ? "str" : m[4] ? "kw" : "num";
    pre.append(el("span", {class:cls}, m[0]));
    last = m.index + m[0].length;
  }
  pre.append(src.slice(last));
  return pre;
}


/* ---------- éditeur exécutable (Kotlin Playground) ----------
   kpState : "loading" tant que le script arrive, "ready" quand il est là, "failed" s'il est injoignable.
   Sans le script, on retombe sur l'affichage simple (bloc de code / zone de texte). */
let kpState = "loading";
let mounts = [];                                   // éditeurs à créer une fois la fiche dans la page
function flushMounts(){ const m = mounts; mounts = []; m.forEach(fn=>{ try{ fn(); }catch(e){} }); }
function runner(src, o){
  o = o || {};
  let cur = src, inst = null, ta = null;
  const wrap = el("div", {class:"kp"});
  const changed = c=>{ if(c === cur) return; cur = c; if(o.onChange) o.onChange(c); };
  const api = {node:wrap, get:()=>cur, run:()=>{ const b = wrap.querySelector(".run-button"); if(b) b.click(); else if(inst) inst.execute(); }, live:false};
  if(kpState === "ready" && window.KotlinPlayground){
    api.live = true;
    const code = el("code", {theme:"darcula", lines:"true", "match-brackets":"true",
      "data-autocomplete":"true", "highlight-on-fly":"true", "none-markers":"true"});
    code.textContent = src;
    wrap.append(code);
    mounts.push(()=>{
      window.KotlinPlayground(code, {getInstance:i=>{ inst = i; }, onChange:changed});
      let tries = 0;                               // l'éditeur se construit juste après : on s'y branche dès qu'il existe
      (function hook(){                            // écoute directe : le brouillon est enregistré à chaque frappe
        const cm = wrap.querySelector(".CodeMirror");
        if(cm && cm.CodeMirror) cm.CodeMirror.on("change", c=>changed(c.getValue()));
        else if(tries++ < 200) setTimeout(hook, 50);
      })();
    });
  }else if(o.editable){
    ta = el("textarea", {spellcheck:"false", autocapitalize:"off", autocomplete:"off", "aria-label":"Ton code Kotlin"});
    ta.value = src;
    ta.addEventListener("input", ()=>{ cur = ta.value; if(o.onChange) o.onChange(cur); });
    wrap.append(ta);
  }else{
    wrap.append(codeBlock(src));
  }
  api.select = ()=>{ if(ta) ta.select(); };
  return api;
}
function kpNote(){
  if(kpState === "ready") return el("p", {class:"note"}, "Clique sur Exécuter (ou sur la flèche verte) : le résultat s'affiche sous le code. Il faut être connecté à Internet.");
  if(kpState === "loading") return el("p", {class:"note"}, "Chargement de l'éditeur exécutable…");
  return el("p", {class:"note"}, "L'éditeur exécutable n'a pas pu se charger (pas de connexion ?). En attendant, copie le code et colle-le sur ",
    el("a", {href:"https://play.kotlinlang.org/", target:"_blank", rel:"noopener"}, "play.kotlinlang.org"), ".");
}
function runBtn(r, label){
  return r.live ? el("button", {class:"btn run", onclick:()=>r.run()}, label || "Exécuter") : null;
}

        S.pats = on ? S.pats.filter(id=>id!==p.id) : P.map(x=>x.id).filter(id=>S.pats.includes(id)||id===p.id);
        update();

  document.getElementById("pickerSum").textContent = "Choisir pattern par pattern (" + S.pats.length + " sur " + P.length + ")";

    const on = S.parts.includes(k);
    parts.append(el("button", {class:"tog", "aria-pressed":String(on), onclick:()=>{
      if(on && S.parts.length===1) return;                     // garder au moins une partie
      S.parts = on ? S.parts.filter(x=>x!==k) : Object.keys(PARTS).filter(x=>S.parts.includes(x)||x===k);
      update();

}

/* ---------- sommaire ---------- */
function status(p){
  const pr = prog(p.id), bits = [];
  if(S.parts.includes("qcm")){
    const done = Object.keys(pr.q).length;
    if(done){ const ok = p.q.filter((q,i)=>pr.q[i]===q.a).length; bits.push("QCM " + ok + "/" + p.q.length); }
  }
  if(S.parts.includes("exo") && pr.x) bits.push(pr.x==="ok" ? "exo réussi" : "exo à revoir");
  return bits.join(" · ");
}

function openFiche(id){                                        // quitte le mode CC et ouvre la fiche d'un pattern
  S.mode = null;
  if(!S.pats.includes(id)) S.pats = P.map(p=>p.id).filter(x=>S.pats.includes(x)||x===id);
  if(!S.parts.includes("cours")) S.parts = Object.keys(PARTS).filter(k=>S.parts.includes(k)||k==="cours");

/* ---------- sujet de CC : contexte, choix des patterns, puis implémentation ---------- */
function renderCC(box){
  const c = S.cc, idx = Math.max(0, SUJETS.findIndex(x=>x.id===c.id)), su = SUJETS[idx];
  const attendus = su.b.map(b=>b.p);
  box.className = "panel lesson";
  box.append(el("header", null,
    el("div", {class:"row", style:"align-items:center"},
      el("span", {class:"pill", style:"--fam:var(--accent)"}, "Sujet de CC"),
      el("span", {class:"sub"}, "Sujet " + (idx+1) + " / " + SUJETS.length + (c.x[su.id]==="ok" ? " · réussi" : c.x[su.id]==="ko" ? " · à revoir" : ""))),
    el("h2", null, su.t)));

  box.append(el("section", {class:"sec"},
    el("h3", null, "Contexte"),
    ...su.ctx.map(t=>el("p", null, t)),
    el("ol", {class:"besoins"}, ...su.b.map(b=>el("li", null, b.t)))));

  /* Étape 1 : choisir les patterns */
  const s1 = el("section", {class:"sec"});
  const s2 = el("section", {class:"sec"});
  const draw1 = ()=>{
    s1.textContent = "";
    s1.append(el("h3", null, "Étape 1 · Quels patterns utiliserais-tu ?"),
      el("p", null, c.ok ? "Voici la correction de ta sélection."
                         : "Coche les patterns qui répondent aux besoins de l'énoncé. Il y en a " + attendus.length + " à trouver, parmi les " + CC.length + " du contrôle."));
    for(const f in FAMS){
      const g = el("div", {class:"famgroup f-"+f}, el("div", {class:"famname"}, FAMS[f]));
      const row = el("div", {class:"row"});
      P.filter(p=>p.f===f && CC.includes(p.id)).forEach(p=>{
        const on = c.sel.includes(p.id), bon = attendus.includes(p.id);
        let cls = "chip", suffixe = "";
        if(c.ok){
          if(on && bon){ cls += " ok"; suffixe = " ✓"; }
          else if(on){ cls += " ko"; suffixe = " ✗"; }
          else if(bon){ cls += " miss"; suffixe = " (oublié)"; }
        }
        row.append(el("button", {class:cls, "aria-pressed":String(on), disabled:c.ok, onclick:()=>{
          c.sel = on ? c.sel.filter(x=>x!==p.id) : c.sel.concat(p.id); save(); draw1();
        }}, p.n + suffixe));
      });
      g.append(row); s1.append(g);
    }
    if(!c.ok){
      s1.append(el("div", {class:"row"},
        el("button", {class:"btn", disabled:!c.sel.length, onclick:()=>{ c.ok = true; save(); draw1(); draw2(); flushMounts(); }}, "Vérifier ma sélection")),
        el("p", {class:"note"}, c.sel.length + (c.sel.length>1 ? " patterns cochés" : " pattern coché") + " sur " + attendus.length + " attendus."));
      return;
    }
    const trouves = attendus.filter(id=>c.sel.includes(id)).length;
    const enTrop = c.sel.filter(id=>!attendus.includes(id));
    s1.append(el("p", {class:"score", role:"status"}, trouves + " / " + attendus.length + " patterns trouvés" + (enTrop.length ? ", " + enTrop.length + " en trop" : "")));
    const corr = el("div", {class:"corr"});
    su.b.forEach((b, i)=>{
      const ok = c.sel.includes(b.p);
      corr.append(el("div", {class:"it" + (ok ? "" : " rate")},
        el("b", null, "Besoin " + (i+1) + " : " + byId(b.p).n + (ok ? " (trouvé)" : " (oublié)")),
        el("p", null, b.w),
        el("button", {class:"linkbtn", onclick:()=>openFiche(b.p)}, "Revoir la fiche " + byId(b.p).n)));
    });
    if(enTrop.length) corr.append(el("div", {class:"it rate"},
      el("b", null, "En trop : " + enTrop.map(id=>byId(id).n).join(", ")),
      el("p", null, "Aucun besoin de l'énoncé ne les demande. Au contrôle, un pattern en trop complique la conception sans rien apporter.")));
    s1.append(corr, el("div", {class:"row"},
      el("button", {class:"btn ghost", onclick:()=>{ c.sel = []; c.ok = false; save(); draw1(); draw2(); }}, "Refaire la sélection")));
  };

  /* Étape 2 : implémenter (débloquée une fois la sélection vérifiée) */
  const draw2 = ()=>{
    s2.textContent = "";
    s2.append(el("h3", null, "Étape 2 · Implémente les patterns"));
    if(!c.ok){ s2.append(el("p", {class:"note"}, "Vérifie d'abord ta sélection : le code de départ s'affichera ensuite.")); return; }
    s2.append(el("p", null, "Écris le code qui répond aux " + su.b.length + " besoins, puis retire les // du main pour le tester."));
    const holder = el("div"), runRow = el("div", {class:"row"});
    let ed;
    const copyBtn = el("button", {class:"btn ghost", onclick:async()=>{
      try{ await navigator.clipboard.writeText(ed.get()); copyBtn.textContent = "Copié"; }
      catch(e){ ed.select(); copyBtn.textContent = "Copie impossible, fais-le à la main"; }
      setTimeout(()=>copyBtn.textContent="Copier mon code", 1800);
    }}, "Copier mon code");
    const solCode = el("div");
    const verdict = el("p", {class:"fb", role:"status"});
    const mark = ()=>{ verdict.textContent = c.x[su.id]==="ok" ? "Sujet marqué comme réussi." : c.x[su.id]==="ko" ? "Sujet marqué à revoir." : ""; };
    const sol = el("div", {style:"display:none;flex-direction:column;gap:10px"},
      solCode,
      el("p", {class:"note"}, "Compare avec ton code. Plusieurs solutions sont valables : ce qui compte, c'est de retrouver la structure de chaque pattern."),
      el("div", {class:"row"},
        el("button", {class:"btn", onclick:()=>{ c.x[su.id]="ok"; save(); mark(); }}, "J'ai réussi"),
        el("button", {class:"btn ghost", onclick:()=>{ c.x[su.id]="ko"; save(); mark(); }}, "À revoir")));
    const showBtn = el("button", {class:"btn ghost", onclick:()=>{
      const open = sol.style.display === "none";
      sol.style.display = open ? "flex" : "none";
      showBtn.textContent = open ? "Masquer la solution" : "Voir la solution";
      if(open && !solCode.firstChild){
        const r = runner(su.s);
        solCode.append(r.node);
        if(r.live) solCode.append(el("div", {class:"row", style:"margin-top:8px"}, runBtn(r, "Exécuter la solution")));
        flushMounts();
      }
    }}, "Voir la solution");
    const mountEd = ()=>{
      ed = runner(c.d[su.id] != null ? c.d[su.id] : su.d, {editable:true, onChange:v=>{ c.d[su.id] = v; save(); }});
      holder.textContent = ""; holder.append(ed.node);
      runRow.textContent = "";
      runRow.append(runBtn(ed), copyBtn,
        el("button", {class:"btn ghost", onclick:()=>{ delete c.d[su.id]; save(); mountEd(); flushMounts(); }}, "Réinitialiser"),
        showBtn);
    };
    mark(); mountEd();
    s2.append(holder, runRow, kpNote(), sol, verdict);
  };
  draw1(); draw2();
  box.append(s1, s2);

  const autre = d=>{ const n = SUJETS[(idx + d + SUJETS.length) % SUJETS.length]; S.cc.id = n.id; S.cc.sel = []; S.cc.ok = false; save(); renderLesson(); toLesson(); };
  box.append(el("nav", {class:"nav"},
    el("button", {class:"btn ghost", onclick:()=>autre(-1)}, "← Sujet précédent"),
    el("button", {class:"btn", onclick:()=>autre(1)}, "Sujet suivant →")));
  flushMounts();
}

    box.append(el("section", {class:"sec"},
      el("h3", null, "Cours"),
      el("div", {class:"kv"}, el("b", null, "Le problème"), el("p", null, p.p)),
      el("div", {class:"kv"}, el("b", null, "L'idée"), el("p", null, p.s)),
      (()=>{
        const c = COURS[p.id];
        if(!c) return null;
        return el("div", {class:"cours"}, el("div", {class:"label"}, "Dans ton cours"),
          el("div", {class:"kv"}, el("b", null, "Principe général"), el("p", null, c.p)),
          c.e ? el("div", {class:"kv"}, el("b", null, "Exemple vu en cours"), el("p", null, c.e)) : null,
          c.r ? el("div", {class:"kv"}, el("b", null, "À retenir"), el("p", null, c.r)) : null);
      })(),
      el("p", {class:"tip"}, "En Kotlin : " + p.k),
      ...(()=>{
        const r = runner(p.c);
        return [r.node, r.live ? el("div", {class:"row"}, runBtn(r, "Exécuter l'exemple")) : null,
          r.live ? el("p", {class:"note"}, "Tu peux modifier l'exemple pour essayer : il revient à l'original quand tu changes de fiche.") : kpNote()];
      })()));
  }

  if(S.parts.includes("qcm")){
    const sec = el("section", {class:"sec"});
    const drawQcm = ()=>{
      sec.textContent = ""; sec.append(el("h3", null, "QCM"));
      p.q.forEach((q, qi)=>{
        const ans = pr.q[qi], done = ans !== undefined;
        const wrap = el("div", {class:"q"}, el("p", null, (qi+1) + ". " + q.q));
        q.o.forEach((o, oi)=>{
          let cls = "opt";
          if(done && oi===q.a) cls += " ok"; else if(done && oi===ans) cls += " ko";
          wrap.append(el("button", {class:cls, disabled:done, onclick:()=>{ pr.q[qi]=oi; save(); renderToc(); drawQcm(); }}, o));
        });
        if(done) wrap.append(el("p", {class:"fb", role:"status"}, (ans===q.a ? "Bonne réponse. " : "Raté. ") + q.e));
        sec.append(wrap);
      });
      if(Object.keys(pr.q).length) sec.append(el("div", null,
        el("button", {class:"btn ghost", onclick:()=>{ pr.q={}; save(); renderToc(); drawQcm(); }}, "Refaire le QCM")));
    };
    drawQcm();
    box.append(sec);
  }

  if(S.parts.includes("exo")){
    const holder = el("div"), runRow = el("div", {class:"row"});
    let ed;
    const mountEd = ()=>{
      ed = runner(pr.d != null ? pr.d : p.x.d, {editable:true, onChange:c=>{ pr.d = c; save(); }});
      holder.textContent = ""; holder.append(ed.node);
      runRow.textContent = "";
      runRow.append(runBtn(ed), copyBtn,
        el("button", {class:"btn ghost", onclick:()=>{ pr.d=null; save(); mountEd(); flushMounts(); }}, "Réinitialiser"),
        showBtn);
    };
    const copyBtn = el("button", {class:"btn ghost", onclick:async()=>{
      try{ await navigator.clipboard.writeText(ed.get()); copyBtn.textContent = "Copié"; }
      catch(e){ ed.select(); copyBtn.textContent = "Copie impossible, fais-le à la main"; }
      setTimeout(()=>copyBtn.textContent="Copier mon code", 1800);
    }}, "Copier mon code");
    const solCode = el("div");
    const sol = el("div", {style:"display:none;flex-direction:column;gap:10px"},
      solCode,
      el("p", {class:"note"}, "Compare avec ton code. Plusieurs solutions sont valables."),
      el("div", {class:"row"},
        el("button", {class:"btn", onclick:()=>{ pr.x="ok"; save(); renderToc(); mark(); }}, "J'ai réussi"),
        el("button", {class:"btn ghost", onclick:()=>{ pr.x="ko"; save(); renderToc(); mark(); }}, "À revoir")));
    const verdict = el("p", {class:"fb", role:"status"});
    const mark = ()=>{ verdict.textContent = pr.x==="ok" ? "Marqué comme réussi." : pr.x==="ko" ? "Marqué à revoir." : ""; };
    mark();
    const showBtn = el("button", {class:"btn ghost", onclick:()=>{
      const open = sol.style.display === "none";
      sol.style.display = open ? "flex" : "none";
      showBtn.textContent = open ? "Masquer la solution" : "Voir la solution";
      if(open && !solCode.firstChild){                          // la solution est exécutable elle aussi
        const r = runner(p.x.s);
        solCode.append(r.node);
        if(r.live) solCode.append(el("div", {class:"row", style:"margin-top:8px"}, runBtn(r, "Exécuter la solution")));
        flushMounts();
      }
    }}, "Voir la solution");
    mountEd();
    box.append(el("section", {class:"sec"},
      el("h3", null, "Exercice"),
      el("p", null, p.x.t),
      holder, runRow, kpNote(),
      sol, verdict));
  }

  box.append(el("nav", {class:"nav"},
    el("button", {class:"btn ghost", disabled:idx===0, onclick:()=>go(list[idx-1].id, true)}, "← Précédent"),
    el("button", {class:"btn", disabled:idx===list.length-1, onclick:()=>go(list[idx+1].id, true)}, "Suivant →")));
  flushMounts();
}

/* ---------- navigation ---------- */
function go(id, scroll){
  S.cur = id; save();
  try{ if(location.hash !== "#"+id) history.replaceState(null, "", "#"+id); }catch(e){}
  renderToc(); renderLesson();
  if(scroll) document.getElementById("lesson").scrollIntoView({block:"start",
    behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
}
function update(){
  const list = selected();
  if(list.length && !list.some(p=>p.id===S.cur)) S.cur = list[0].id;
  save(); renderConfig(); renderToc(); renderLesson();
}
function fromHash(){
  const id = location.hash.slice(1);
  if(byId(id)){
    if(!S.pats.includes(id)) S.pats = P.map(p=>p.id).filter(x=>S.pats.includes(x)||x===id);
    S.cur = id;
  }
}
addEventListener("hashchange", ()=>{ if(byId(location.hash.slice(1))) S.mode = null; fromHash(); update(); });
if(!byId(S.cur)) S.cur = P[0].id;
fromHash(); update();

/* Charge l'éditeur exécutable sans bloquer l'affichage de la page, puis redessine la fiche. */
(function(){
  const sc = document.createElement("script");
  sc.src = "https://unpkg.com/kotlin-playground@1";
  sc.async = true;
  sc.onload = ()=>{ kpState = window.KotlinPlayground ? "ready" : "failed"; renderLesson(); };
  sc.onerror = ()=>{ kpState = "failed"; renderLesson(); };
  document.head.append(sc);
})();
</script>
</body>
